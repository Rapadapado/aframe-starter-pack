<!DOCTYPE html>
<html>

    <a-scene>

    <a-assests>

      <img id="Sand" src="Assests/AdobeStock_412924544.jpeg">

    <a-box src="#Sand" position="15 -5 -31" rotation="0 90 0" width="2.5" depth="3" height="3.5" width="2"></a-box>

    <a-box src="#Sand" position="23 -5.75 -28" rotation="90 0 0" depth="2" height="7" width="2"></a-box>
    

    <!--Cone-->
      <a-sphere src="#IceCream" position="-3 1 -10" radius="1.4"></a-sphere>

      <a-sky src="#background" radius="50"></a-sky>
