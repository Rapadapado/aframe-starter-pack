<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>

      <a-assest>
        <img id="background" src="Assets/Sky.jpeg">
        <img id="ground" src="Assets/Grass.jpeg">
        <img id="bark" src="Assets/AdobeStock_201320534.jpeg">
      </a-assest>

      <!--Background/Ground-->
      <a-sky src="#background"></a-sky>
      <a-plane src="#ground" position="0 0 0" rotation="-90 0 0"  width="500" height="500"></a-plane>
      
      <!--Tree-->
      <a-cylinder src="#bark" height="75" radius="12.5" position="0 1 -50" ></a-cylinder>
      <a-torus-knot color="#ffb7c5" position="0 75 -50" radius-tubular="20" ></a-torus-knot>

      <!--Right Branches-->
      <a-cylinder src="#bark" height="15.1" radius="1" position="15 30 -50" rotation="0 0 135"></a-cylinder>
      <a-cylinder src="#bark" height="15" radius="1" position="21 36 -50" rotation="135 0 0"></a-cylinder>
      <a-cylinder src="#bark" height="25" radius="1" position="32 47 -55" rotation="0 0 120"></a-cylinder>
      <a-cylinder src="#bark" height="10" radius="1" position="33 43 -55" rotation="0 0 0"></a-cylinder>
      <a-cylinder src="#bark" height="10" radius="1" position="42 56 -51" rotation="45 0 0"></a-cylinder>
      <a-cylinder src="#bark" height="10" radius="1" position="42 55 -58" rotation="-45 0 0"></a-cylinder>
      <!--a-torus-knot position="20 35 -50" radius-tubular="3"></a-torus-knot>
      
    </a-scene>
  </body>
</html>
